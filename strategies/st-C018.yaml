id: st-C018
name: Reflexion：语言化反思存入情景记忆（经典）
tier: A
claim: Reflexion语言化反思：把失败反思存入情景记忆再重试，HumanEval pass@1达91%超当时GPT-4的80%
claimed_value:
  metric: pass_at_1
  direction: up
  context: 反思与自修正；A/B：失败后裸重试 vs 重试前注入结构化反思；反思须语言化存入情景记忆槽并在下次尝试前按需拉回（S022 测试设计口径）
sources: [MC-Reflexion, S022]
consensus: { corpora: 2, cards: 2 }
experiment: { status: none, exp_id: "-", note: "-" }
dsl_state: compilable
dsl_snippet: |
  version: 1
  meta:
    name: reflexion_episodic
    graph_version: "1.0"
    entry: practice
    input: reflex_input
    output: { ref: code_artifact, from: practice }
    intent: "反思环：actor 尝试（上下文含情景记忆最近 K 条）→ 外部评估器出 verdict → reflector 把失败语言化为反思写入情景记忆槽（单写者）→ 回灌 actor 重试；增益来自外部信号+结构化反思，而非裸重试"
  types:
    - name: reflex_input
      schema:
        type: object
        required: [question]
        properties: { question: { type: string } }
    - name: code_artifact
      schema:
        type: object
        required: [source]
        properties: { source: { type: string } }
    - name: verdict
      schema:
        type: object
        required: [pass, failures]
        properties:
          pass: { type: boolean }
          failures: { type: array, items: { type: string } }
    - name: reflection
      schema:
        type: object
        required: [episode_id, lesson]
        properties:
          episode_id: { type: string }
          lesson: { type: string }
  stores:
    - name: episodes
      type: collection
      item: reflection
      writer: practice.reflector
      lifecycle: run
      retention: { max_items: 64 }
  nodes:
    - id: practice
      kind: task
      loop:
        body:
          nodes:
            - id: actor
              kind: task
              uses: { model: route.main@1 }
              consumes: { feedback: reflection }
              emits: { attempt: code_artifact }
              context:
                sections:
                  - { from: template, template_ref: pkg.reflex.actor_system, quota_tokens: 500 }
                  - { from: input, fields: [question], policy: project, quota_tokens: 300 }
                  - { from: store, store: episodes, policy: latest_k, args: { k: 3 }, quota_tokens: 1200 }
                  - { from: edge, port: feedback, fields: [lesson], policy: project, quota_tokens: 400, optional: true }
            - id: assess
              kind: check
              uses: { unit: pkg.reflex.test_unit@1 }
              consumes: { attempt: code_artifact }
              emits: { verdict: verdict }
            - id: reflector
              kind: task
              uses: { model: route.main@1 }
              consumes: { verdict: verdict }
              writes: [episodes]
              emits: { reflection: reflection }
              context:
                sections:
                  - { from: template, template_ref: pkg.reflex.reflector_system, quota_tokens: 400 }
                  - { from: edge, port: verdict, fields: [pass, failures], policy: project, quota_tokens: 800 }
          edges:
            - { from: actor, output: attempt, to: assess, input: attempt }
            - { from: assess, output: verdict, to: reflector, input: verdict }
            - { from: reflector, output: reflection, to: actor, input: feedback }
        max_iterations: 4
        carried:
          - { store: episodes, max_items: 64 }
        safety_points:
          - { node: assess, kind: check }
        exit_when: "attempt.passed == true"
        on_exhausted: fail
      emits: { final: { from_body: actor.attempt } }
  edges: []
  policies:
    budgets:
      - { id: cost_cap, dimension: cents, scope: plan, cap: 500 }
      - { id: turns_cap, dimension: turns, scope: loop:practice, cap: 24 }
    failures:
      - class: schema_invalid
        retry: { max: 2, backoff_ms: 0 }
      - class: budget_exhausted
        terminal: true
        outcome: failed
