needs_syntax_note: "缺「缓存亲和声明」两处语法：\n① 上下文布局约束：v0.1 的 context.sections 有声明序但无「稳定前缀/append-only/禁动态时间戳」的布局约束表达，缓存友好的布局不可声明、不可校验；\n② cache_key 粘性路由：uses.model 是静态端点串，无「同 cache_key 粘住同端点/同会话」的路由面。\n扩展建议（示例）：\n  meta:\n    cache_affinity:\n      stable_prefix: [template, static_docs]        # 稳定段前置（禁动态内容）\n      layout: append_only                           # 布局约束\n  # 节点/uses 级：\n  #   uses: { model: route.main@1, cache_key: { from: input.session_id, sticky: true } }\n簇内提示：两卡 link_dead=true（确证线带豁免），落地上限前应先在自家 harness 复测价差假设。"
