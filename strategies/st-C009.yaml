id: st-C009
name: AFlow（工作流自动搜索：把 agent 工作流表达成 MCTS 搜索空间中的代码图，自动生成+评分工作流）
tier: A
claim: AFlow：把agent工作流写成可执行Python代码图，MCTS元智能体做代码级变异，按质量+成本分搜索最优
claimed_value:
  metric: quality_cost_score
  direction: up
  context: 规划与分解；预算有四层：MCTS 迭代轮数上限、每候选评估任务样本数（小子集采样）、LLM token/成本上限（体现在打分中并反向抑制高成本工作流）、单节点质量目标阈值（MC-AFlow 卡⑤原文口径）
sources: [MC-AFlow, MC-GPTSwarm]
consensus: { corpora: 2, cards: 2 }
experiment: { status: none, exp_id: "-", note: "-" }
dsl_state: compilable
dsl_snippet: |
  version: 1
  meta:
    name: aflow_mcts_search
    graph_version: "1.0"
    entry: loader
    input: search_input
    output: { ref: candidate, from: best }
    intent: "搜索元循环=受控循环：合成（L4 逃逸：元智能体产出候选代码图变体）→ map 并行执行候选 → 外部评估（参考答案只对评估器可读，INV-4）→ 记分板按质量+成本落账；经验池有界，跑满预算取最优"
  types:
    - name: search_input
      schema:
        type: object
        required: [problem, validation_set]
        properties:
          problem: { type: string }
          validation_set:
            type: array
            items:
              type: object
              required: [prompt]
              properties: { prompt: { type: string } }
    - name: candidate
      schema:
        type: object
        required: [ref, parent]
        properties:
          ref: { type: string }
          parent: { type: integer }
    - name: answer
      schema:
        type: object
        required: [text]
        properties: { text: { type: string } }
    - name: tally_result
      schema:
        type: object
        required: [answers, top_count, top_share_milli]
        properties:
          answers: { type: integer }
          top_count: { type: integer }
          top_share_milli: { type: integer }
    - name: score_record
      schema:
        type: object
        required: [candidate, quality_milli, cost_milli]
        properties:
          candidate: { type: integer }
          quality_milli: { type: integer }
          cost_milli: { type: integer }
  stores:
    - name: experience
      type: collection
      item: score_record
      writer: search.scoreboard
      lifecycle: run
      retention: { max_items: 20 }
    - name: answers_ref
      type: collection
      item: answer
      writer: loader
      lifecycle: run
      retention: { max_items: 64 }
      eval_input: true
  nodes:
    - id: loader
      kind: task
      uses: { tool: pkg.searchkit.corpus@1 }
      writes: [answers_ref]
      emits: { done: signal }
    - id: search
      kind: task
      loop:
        body:
          nodes:
            - id: synth
              kind: task
              escape:
                impl_ref: packages/searchkit@1.0.0/hatches/graph_synth.py
                reason: "元智能体产出候选变体：核心只允许对已注册算子集做参数化组变；任意拓扑合成经逃逸并版本化登记后实例化"
                owner: lang-team
                share_budget_pct: 30
              reads: [experience]
              emits: { candidates: "list<candidate>" }
            - id: run
              kind: task
              map:
                over: synth.candidates
                body:
                  nodes:
                    - id: gen_a
                      kind: task
                      uses: { model: route.main@1 }
                      emits: { draft: answer }
                      context:
                        sections:
                          - { from: template, template_ref: pkg.searchkit.solver_system, quota_tokens: 500 }
                          - { from: arg, name: item, policy: project, quota_tokens: 600 }
                    - id: gen_b
                      kind: task
                      uses: { model: route.alt@1 }
                      emits: { draft: answer }
                      context:
                        sections:
                          - { from: template, template_ref: pkg.searchkit.solver_system, vars: { variant: b }, quota_tokens: 500 }
                          - { from: arg, name: item, policy: project, quota_tokens: 600 }
                    - id: aggregate
                      kind: transform
                      consumes: { draft_a: answer, draft_b: answer }
                      ops:
                        - { op: tally, port: draft_a, by: text, into: votes }
                        - { op: select_best, port: draft_b, by: text, prefer: max, into: answer }
                      emits:
                        votes: tally_result
                        answer: answer
                  edges:
                    - { from: gen_a, output: draft, to: aggregate, input: draft_a }
                    - { from: gen_b, output: draft, to: aggregate, input: draft_b }
              emits: { items: { from_body: aggregate.answer } }
            - id: assess
              kind: check
              uses: { unit: pkg.searchkit.assess@1 }
              reads: [answers_ref]
              consumes: { items: "list<answer>" }
              emits: { scores: "list<score_record>" }
            - id: scoreboard
              kind: transform
              consumes: { scores: "list<score_record>" }
              writes: [experience]
              ops:
                - { op: project, port: scores, into: experience }
              emits: {}
          edges:
            - { from: synth, output: candidates, to: run, input: candidates }
            - { from: run, output: items, to: assess, input: items }
            - { from: assess, output: scores, to: scoreboard, input: scores }
        max_iterations: 20
        carried:
          - { store: experience, max_items: 20 }
        safety_points:
          - { node: assess, kind: check }
        exit_when: "budget.cents_spent >= budget.cents_cap * 9 / 10"
        on_exhausted: continue
    - id: best
      kind: transform
      reads: [experience]
      ops:
        - { op: select_best, port: experience, by: quality_milli, prefer: max, into: winner }
      emits: { winner: candidate }
  edges:
    - { from: loader, output: done, to: search, input: done }
    - { from: search, output: done, to: best, input: done }
  policies:
    budgets:
      - { id: cost_cap, dimension: cents, scope: plan, cap: 5000 }
      - { id: eval_tokens, dimension: tokens_total, scope: loop:search, cap: 2000000 }
    failures:
      - class: schema_invalid
        retry: { max: 2, backoff_ms: 0 }
        route: next_iteration
      - class: tool_error
        route: next_iteration
      - class: budget_exhausted
        terminal: true
        outcome: completed
