id: st-b-C086
name: "上下文压缩四件套：阈值触发 + 结构化交接摘要 + 保留最近比例原文 + 摘要失败降级为截断"
tier: B
claim: "上下文压缩四件套：阈值触发+结构化交接摘要+保留最近比例原文+摘要失败降级为截断"
claimed_value:
  metric: "context_compression_robustness"
  direction: up
  context: "对照组=只做截断式压缩（丢弃最旧消息）或不压缩直到超限报错；实验组=四件套"
sources: [S082, S083]
consensus: {corpora: 1, cards: 2}
experiment: {status: none, exp_id: "-", note: "-"}
dsl_state: compilable
dsl_snippet: |
  version: 1
  meta:
    name: compression_four_piece
    graph_version: "1.0"
    entry: solve_loop
    input: ticket
    output: { ref: resolution, from: conclude }
    intent: "压缩四件套投影：①阈值触发=组件 pkg.ctx.compressor@1 内参数（S082/S083 同源锚 0.80；v0.1 段面无 trigger 位）②结构化交接摘要=handoff 模板段（vars 绑 goal/done/next/blockers）③保留最近比例原文=latest_k 段（比例 0.25 按窗口折算 k=8）④摘要失败降级 truncate=组件内降级链（v0.1 无 on_failure 位）。对照臂=纯截断至超限（st-b-C028 同族，簇内矛盾 S001↔S009 已登记，落地同台 A/B）"
  types:
    - name: ticket
      schema:
        type: object
        required: [goal, done, next, blockers]
        properties:
          goal: { type: string }
          done: { type: string }
          next: { type: string }
          blockers: { type: string }
    - name: turn_note
      schema:
        type: object
        required: [body]
        properties:
          body: { type: string }
    - name: resolution
      schema:
        type: object
        required: [status]
        properties:
          status: { type: string }
  stores:
    - name: history
      type: message_log
      writer: solve_loop
      lifecycle: run
      retention: { max_items: 512 }
  nodes:
    - id: solve_loop
      kind: task
      uses: { model: route.main@1 }
      loop:
        body:
          nodes:
            - id: step
              kind: task
              uses: { model: route.main@1 }
              emits: { note: turn_note, state: turn_note }
              context:
                sections:
                  - { from: template, template_ref: pkg.ctx.handoff, vars: { goal: input.goal, done: input.done, next: input.next, blockers: input.blockers }, quota_tokens: 500 }
                  - { from: store, store: history, policy: summarize, component: pkg.ctx.compressor@1, quota_tokens: 1200 }
                  - { from: store, store: history, policy: latest_k, args: { k: 8 }, quota_tokens: 700 }
            - id: done_check
              kind: check
              uses: { unit: pkg.ticket.done_probe@1 }
              consumes: { state: turn_note }
              emits: { state: turn_note }
          edges:
            - { from: step, output: state, to: done_check, input: state }
        max_iterations: 14
        safety_points:
          - { node: done_check, kind: check }
        exit_when: "attempt.passed == true"
        on_exhausted: continue
      writes: [history]
      emits: { state: { from_body: step.state } }
    - id: conclude
      kind: task
      uses: { model: route.main@1 }
      consumes: { state: turn_note }
      emits: { resolution: resolution }
      context:
        sections:
          - { from: template, template_ref: pkg.ctx.conclude_system, quota_tokens: 300 }
          - { from: edge, port: state, quota_tokens: 500 }
  edges:
    - { from: solve_loop, output: state, to: conclude, input: state }
  policies:
    budgets:
      - { id: cost_cap, dimension: cents, scope: plan, cap: 550 }
    failures:
      - { class: budget_exhausted, terminal: true, outcome: failed }
